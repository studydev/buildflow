[tool.poetry]
name = "buildflow-api"
version = "1.0.0"
description = "BuildFlow Backend API - Learning content management and GitHub analysis"
authors = ["BuildFlow Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.9"

# Core
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = { extras = ["email"], version = "^2.10.0" }
pydantic-settings = "^2.6.0"

# Database
azure-cosmos = "^4.9.0"

# Security
PyJWT = "^2.10.0"
cryptography = "^44.0.0"

# Utilities
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"
ruff = "^0.8.0"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "F841"]  # Ignore line length, import order, unused vars for now

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E402"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
