# BuildFlow - Frontend Deployment (Azure Static Web Apps)
# T901: GitHub Actions for Frontend deployment
#
# Trigger: After Frontend CI succeeds on develop branch
# Actions:
# - Build Vue 3 + Vite app
# - Deploy to Azure Static Web Apps

name: Deploy Frontend

on:
  # Triggered when Frontend CI workflow completes on develop branch
  workflow_run:
    workflows: ["Frontend CI"]
    types:
      - completed
    branches:
      - develop
  
  # PR preview deployments
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
  
  # Manual trigger for emergency deployments
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Pre-check: Only deploy if CI passed (skip if workflow_dispatch or PR)
  # ==========================================================================
  
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check if should deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger - deploying"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ PR preview - deploying"
          elif [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend CI passed - deploying"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "❌ Frontend CI failed - skipping deployment"
          fi

  # ==========================================================================
  # Build
  # ==========================================================================
  
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set API URL for environment
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "VITE_API_URL=${{ secrets.PROD_API_URL }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.DEV_API_URL }}" >> $GITHUB_ENV
          fi
      
      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

  # ==========================================================================
  # Deploy to Dev
  # ==========================================================================
  
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      
      - name: Deploy to Azure Static Web Apps (Dev)
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true
          skip_api_build: true

  # ==========================================================================
  # Deploy to Prod (future - when main branch CI is enabled)
  # ==========================================================================
  
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      
      - name: Deploy to Azure Static Web Apps (Prod)
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'dist'
          skip_app_build: true
          skip_api_build: true

  # ==========================================================================
  # Close Pull Request (cleanup staging)
  # ==========================================================================
  
  close-pr:
    name: Close PR - Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    
    steps:
      - name: Close Pull Request (Dev)
        if: github.base_ref == 'develop'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: 'close'
      
      - name: Close Pull Request (Prod)
        if: github.base_ref == 'main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          action: 'close'
