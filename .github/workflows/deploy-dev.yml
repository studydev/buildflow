# BuildFlow - Dev Environment Deployment
# Per tasks.md T801: GitHub Actions for Dev
#
# Trigger: Push to develop branch
# Actions:
# - Build and push API Docker image
# - Build and push Pipeline Docker image
# - Deploy infrastructure via Bicep
# - Deploy Container Apps

name: Deploy to Dev

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (Bicep)'
        required: false
        default: 'true'
        type: boolean
      deploy_api:
        description: 'Deploy API container'
        required: false
        default: 'true'
        type: boolean
      deploy_pipeline:
        description: 'Deploy Pipeline container'
        required: false
        default: 'true'
        type: boolean

env:
  AZURE_RESOURCE_GROUP: rg-buildflow-dev
  AZURE_LOCATION: koreacentral
  PROJECT_NAME: buildflow
  ENVIRONMENT: dev
  REGISTRY_NAME: crbuildflowdev
  API_IMAGE_NAME: buildflow-api
  PIPELINE_IMAGE_NAME: buildflow-pipeline

jobs:
  # ==========================================================================
  # Build Jobs
  # ==========================================================================
  
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_api != 'false'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  build-pipeline:
    name: Build Pipeline Image
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_pipeline != 'false'
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.PIPELINE_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.pipeline
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy Infrastructure
  # ==========================================================================
  
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: github.event.inputs.deploy_infra != 'false'
    needs: [build-api, build-pipeline]
    # Run even if build jobs are skipped
    if: always() && (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') && (needs.build-pipeline.result == 'success' || needs.build-pipeline.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=${{ env.PROJECT_NAME }} environment=${{ env.ENVIRONMENT }}
      
      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            projectName=${{ env.PROJECT_NAME }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            githubToken=${{ secrets.GH_TOKEN }}
            azureOpenAiKey=${{ secrets.AZURE_OPENAI_KEY }}
            azureOpenAiEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiDeployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            containerRegistryLoginServer=${{ env.REGISTRY_NAME }}.azurecr.io
            pipelineImageTag=${{ github.sha }}
            enableMonitoring=true
            enablePipelines=true
          failOnStdErr: false

  # ==========================================================================
  # Deploy Container App
  # ==========================================================================
  
  deploy-api:
    name: Deploy API Container
    runs-on: ubuntu-latest
    needs: [build-api, deploy-infrastructure]
    if: always() && needs.build-api.result == 'success' && needs.deploy-infrastructure.result == 'success'
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get Container App name
        id: get-app
        run: |
          APP_NAME=$(az containerapp list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, 'ca-')].name" \
            --output tsv | head -n 1)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
      
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ steps.get-app.outputs.app_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.API_IMAGE_NAME }}:${{ github.sha }}

  # ==========================================================================
  # Post-Deployment Validation
  # ==========================================================================
  
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [deploy-api]
    if: always() && needs.deploy-api.result == 'success'
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get API URL
        id: get-url
        run: |
          API_URL=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name $(az containerapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'ca-')].name" --output tsv | head -n 1) \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "api_url=https://$API_URL" >> $GITHUB_OUTPUT
      
      - name: Health Check
        run: |
          echo "Checking API health at ${{ steps.get-url.outputs.api_url }}/health"
          
          # Wait for deployment to stabilize
          sleep 30
          
          # Check health endpoint
          for i in {1..5}; do
            if curl -sf "${{ steps.get-url.outputs.api_url }}/health" > /dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1
      
      - name: Post deployment summary
        run: |
          echo "## 🚀 Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.get-url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
