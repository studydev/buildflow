# BuildFlow - Dev Environment Deployment
# Per tasks.md T801: GitHub Actions for Dev
#
# Trigger: After Backend CI succeeds on develop branch
# Order: Infrastructure first, then Build, then Deploy
# - Deploy infrastructure via Bicep (creates ACR)
# - Build and push API Docker image
# - Build and push Pipeline Docker image  
# - Deploy Container Apps

name: Deploy to Dev

on:
  # Triggered when Backend CI workflow completes on develop branch
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - develop
  
  # Manual trigger for emergency deployments
  workflow_dispatch:
    inputs:
      deploy_infra:
        description: 'Deploy infrastructure (Bicep)'
        required: false
        default: 'true'
        type: boolean
      deploy_api:
        description: 'Deploy API container'
        required: false
        default: 'true'
        type: boolean
      deploy_pipeline:
        description: 'Deploy Pipeline container'
        required: false
        default: 'true'
        type: boolean

env:
  AZURE_RESOURCE_GROUP: rg-buildflow-dev
  AZURE_LOCATION: koreacentral
  PROJECT_NAME: buildflow
  ENVIRONMENT: dev
  API_IMAGE_NAME: buildflow-api
  PIPELINE_IMAGE_NAME: buildflow-pipeline

jobs:
  # ==========================================================================
  # Pre-check: Only deploy if CI passed (skip if workflow_dispatch)
  # ==========================================================================
  
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check if should deploy
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Manual trigger - deploying"
          elif [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Backend CI passed - deploying"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "❌ Backend CI failed - skipping deployment"
          fi

  # ==========================================================================
  # Deploy Infrastructure FIRST (creates ACR)
  # ==========================================================================
  
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true' && github.event.inputs.deploy_infra != 'false'
    outputs:
      acr_name: ${{ steps.get-acr.outputs.acr_name }}
      acr_login_server: ${{ steps.get-acr.outputs.acr_login_server }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }} \
            --tags project=${{ env.PROJECT_NAME }} environment=${{ env.ENVIRONMENT }}
      
      - name: Deploy Bicep template
        uses: azure/arm-deploy@v2
        id: deploy
        with:
          resourceGroupName: ${{ env.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >
            environment=${{ env.ENVIRONMENT }}
            projectName=${{ env.PROJECT_NAME }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            githubToken=${{ secrets.GH_TOKEN }}
            azureOpenAiKey=${{ secrets.AZURE_OPENAI_KEY }}
            azureOpenAiEndpoint=${{ secrets.AZURE_OPENAI_ENDPOINT }}
            azureOpenAiDeployment=${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
            pipelineImageTag=${{ github.sha }}
            enableMonitoring=true
            enablePipelines=true
            enableFrontend=true
          failOnStdErr: false
      
      - name: Get ACR Info
        id: get-acr
        run: |
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].loginServer" -o tsv)
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "ACR Name: $ACR_NAME"
          echo "ACR Login Server: $ACR_LOGIN_SERVER"

  # ==========================================================================
  # Build API Image (after infrastructure)
  # ==========================================================================
  
  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: github.event.inputs.deploy_api != 'false' && needs.deploy-infrastructure.result == 'success'
    outputs:
      image_tag: ${{ github.sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ needs.deploy-infrastructure.outputs.acr_name }}
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ needs.deploy-infrastructure.outputs.acr_login_server }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
            ${{ needs.deploy-infrastructure.outputs.acr_login_server }}/${{ env.API_IMAGE_NAME }}:latest
          no-cache: true
  
  # ==========================================================================
  # Build Pipeline Image (after infrastructure)
  # ==========================================================================
  
  build-pipeline:
    name: Build Pipeline Image
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    if: github.event.inputs.deploy_pipeline != 'false' && needs.deploy-infrastructure.result == 'success'
    outputs:
      image_tag: ${{ github.sha }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Login to ACR
        run: |
          az acr login --name ${{ needs.deploy-infrastructure.outputs.acr_name }}
      
      - name: Build and push Pipeline image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.pipeline
          push: true
          tags: |
            ${{ needs.deploy-infrastructure.outputs.acr_login_server }}/${{ env.PIPELINE_IMAGE_NAME }}:${{ github.sha }}
            ${{ needs.deploy-infrastructure.outputs.acr_login_server }}/${{ env.PIPELINE_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy Container App
  # ==========================================================================
  
  deploy-api:
    name: Deploy API Container
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, build-api]
    if: always() && needs.build-api.result == 'success'
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get Container App name
        id: get-app
        run: |
          APP_NAME=$(az containerapp list \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[?contains(name, 'ca-')].name" \
            --output tsv | head -n 1)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
      
      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME=$(echo "${{ needs.deploy-infrastructure.outputs.acr_login_server }}" | cut -d'.' -f1)
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "password=$ACR_PASSWORD" >> $GITHUB_OUTPUT
      
      - name: Configure ACR registry for Container App
        run: |
          az containerapp registry set \
            --name ${{ steps.get-app.outputs.app_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --server ${{ needs.deploy-infrastructure.outputs.acr_login_server }} \
            --username ${{ steps.acr-creds.outputs.username }} \
            --password ${{ steps.acr-creds.outputs.password }}
      
      - name: Update Container App
        run: |
          az containerapp update \
            --name ${{ steps.get-app.outputs.app_name }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.deploy-infrastructure.outputs.acr_login_server }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars "IMAGE_TAG=${{ github.sha }}"

  # ==========================================================================
  # Post-Deployment Validation
  # ==========================================================================
  
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [deploy-api]
    if: always() && needs.deploy-api.result == 'success'
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Get API URL
        id: get-url
        run: |
          API_URL=$(az containerapp show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name $(az containerapp list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?contains(name, 'ca-')].name" --output tsv | head -n 1) \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "api_url=https://$API_URL" >> $GITHUB_OUTPUT
      
      - name: Health Check
        run: |
          echo "Checking API health at ${{ steps.get-url.outputs.api_url }}/health"
          
          # Wait for deployment to stabilize
          sleep 30
          
          # Check health endpoint
          for i in {1..5}; do
            if curl -sf "${{ steps.get-url.outputs.api_url }}/health" > /dev/null; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "❌ Health check failed after 5 attempts"
          exit 1
      
      - name: Post deployment summary
        run: |
          echo "## 🚀 Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API URL:** ${{ steps.get-url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
